<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Systems · Setmi India Intranet</title><link rel="icon" href="https://setmiindia.com/wp-content/uploads/2026/06/cropped-ChatGPT-Image-Jun-5-2026-01_07_56-PM-192x192.png"><link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script><script src="assets/app.js"></script></head>
<body><main><h1>My Systems</h1><p class="sub">Personal to each login. Filtered by whoever is signed in.</p><div id="root"></div></main>
<script>window.page=()=>{const root=document.getElementById("root");

const emails=[...new Set(D.members.map(m=>m.email))];
root.innerHTML=`<p>Signed in as (demo): <select id="who">${emails.map(e=>`<option>${e}</option>`).join("")}</select></p><div id="out"></div>
<div class="note">Live version: the Apps Script web app filters the Systems Register Members tab by the signed-in email (see apps-script/).</div>`;
const draw=()=>{const e=$("#who").value;const rows=D.members.filter(m=>m.email===e).map(m=>{const s=D.systems.find(x=>x.id===m.sid);
return [s.name,s.what,chip(m.role,m.role==="Owner"?"o":""),`<a class="btn" href="${s.form}">Form</a><a class="btn" href="${s.sheet}">Sheet</a>`,s.owner,s.status];});
$("#out").innerHTML=table(["System","What for","Your role","Open","Owner","Status"],rows);};
$("#who").onchange=draw;draw();
};</script></body></html>
